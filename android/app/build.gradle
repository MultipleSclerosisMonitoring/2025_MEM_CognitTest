plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if(keystorePropertiesFile.exists()){
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.upm.sdmt"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.upm.sdmt"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 30
        targetSdk = 36
        versionCode =14 
        versionName = "1.6"
        // Desactiva soporte a componentes diferidos
        manifestPlaceholders += [playstore_deferred_components_enabled: "false"]


    }

    signingConfigs{
        release{
            // [CORRECCIÓN] SOLO CONFIGURAMOS LOS ARCHIVOS DE FIRMA SI EL ARCHIVO 'key.properties' EXISTE.
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Utilizamos el signingConfig 'release' SOLO si se pudo configurar.
            // Si no se configuró, Gradle usará la configuración de 'debug' por defecto para el modo 'release' de desarrollo.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug // Fallback to debug signing if no release keys are present
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),  'proguard-rules.pro'
        }
    }

}

dependencies{
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
}

flutter {
    source = "../.."
}
